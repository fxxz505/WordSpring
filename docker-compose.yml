services:
  mysql:
    image: mysql:8.4
    container_name: wordspring-mysql
    environment:
      MYSQL_DATABASE: wordspring
      MYSQL_USER: wordspring
      MYSQL_PASSWORD: wordspring
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uwordspring", "-pwordspring"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
